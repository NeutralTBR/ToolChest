name: Site CI

on:
  push:
    branches: [ main ]
    paths-ignore: 
      - "README.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches: [ main ]
  workflow_dispatch:   
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read  
jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "content/**/*.md"

  build-and-check-links:
    name: Zola Build & Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - name: Check Zola integrity
        run: zola check  

      - name: Build site
        run: zola build
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --accept 200..=204,429
            --root-dir public
            './public/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}